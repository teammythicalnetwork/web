<style>

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.18);transition:.3s}.card:hover{border-color:rgba(139,124,255,.45);transform:translateY(-5px)}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:rgba(139,124,255,.13);font-size:21px;margin-bottom:20px}.card h3{margin:0 0 7px;font-size:21px}.card p{margin:0 0 22px;color:var(--muted)}.arrow{color:#b7afff;font-weight:850}

const commands=[["Go to About","#about"],["Go to Projects","#projects"],["Go to Team","#team"],["Go to Services","#services"],["Go to Studio OS","#command-center"],["Go to Showcase","#showcase"],["Go to Experiments","#lab"],["Go to Ideas Wall","#ideas"],["Go to Customize","#customize"],["Go to Roadmap","#roadmap"],["Go to FAQ","#faq"],["Go to Contact","#contact"],["Go to Community","#community"],["Open SparkAgent","https://sparkagent.in.net"],["Open Store","https://store.mythicalstudios.online"],["Open Main Site","https://mythicalstudios.info"]];
function renderCommands(q=""){commandList.innerHTML=commands.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map((x,i)=>'<div class="command-item" data-cmd="'+i+'"><span>'+x[0]+'</span><span class="kbd">↵</span></div>').join("")}
function openCommand(){command.classList.add("open");commandInput.value="";renderCommands();setTimeout(()=>commandInput.focus(),30)}
function closeCommand(){command.classList.remove("open")}
function runCommand(i){const target=commands[i]?.[1];if(!target)return;closeCommand();if(target.startsWith("#"))document.querySelector(target)?.scrollIntoView({behavior:"smooth"});else window.open(target,"_blank","noopener")}

function renderShowcase(){const x=showcaseData[showcaseIndex];document.getElementById('showcaseArt').style.backgroundImage="url('"+x.img+"')";document.getElementById('showcaseType').textContent=x.type;document.getElementById('showcaseName').textContent=x.name;document.getElementById('showcaseText').textContent=x.text;document.getElementById('showcaseChips').innerHTML=x.chips.map(c=>'<span class="chip">'+c+'</span>').join('')}function showcaseMove(n){showcaseIndex=(showcaseIndex+n+showcaseData.length)%showcaseData.length;renderShowcase()}renderShowcase();
const ideaKey='mythical-ideas';function getIdeas(){try{return JSON.parse(localStorage.getItem(ideaKey)||'[]')}catch{return[]}}function saveIdeas(x){localStorage.setItem(ideaKey,JSON.stringify(x))}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderIdeas(){const list=document.getElementById('ideaList'),items=getIdeas();if(!items.length){list.innerHTML='<div class="idea-item"><div><b>No ideas yet.</b><small>Be the first to add one.</small></div><span>✦</span></div>';return}list.innerHTML=items.map((x,i)=>'<div class="idea-item"><div><b>'+escapeHtml(x.title)+'</b><small>'+escapeHtml(x.type)+' · '+(x.votes||0)+' local votes</small></div><button class="vote" onclick="voteIdea('+i+')">▲ '+(x.votes||0)+'</button></div>').join('')}function voteIdea(i){const x=getIdeas();x[i].votes=(x[i].votes||0)+1;saveIdeas(x);renderIdeas();showToast('Idea boosted on this device ✦')}document.getElementById('ideaForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('ideaTitle').value.trim();if(!title)return;const x=getIdeas();x.unshift({title,type:document.getElementById('ideaType').value,votes:0});saveIdeas(x.slice(0,12));e.target.reset();renderIdeas();showToast('Idea added to the wall ✦')});renderIdeas();

const siteTargets=[['Projects','AI, gaming and studio projects','projects'],['About','Studio story and mindset','about'],['Team','Meet Chethan, Vijay, Venkat and Kedar','team'],['Services','What the studio does','services'],['Studio OS','Project matrix and command center','command-center'],['Showcase','Featured projects','showcase'],['Experiments Lab','Creative experiments','lab'],['Ideas Wall','Local idea board','ideas'],['Customize','Theme and accent controls','customize'],['Roadmap','Studio journey','roadmap'],['FAQ','Frequently asked questions','faq'],['Tools','Useful visitor utilities','tools'],['Contact','Contact and future ideas','contact'],['Community','YouTube, Discord and social links','community']];
function renderSiteSearch(q=''){const box=document.getElementById('searchResults');if(!q){box.innerHTML='';return}const hits=siteTargets.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q.toLowerCase())).slice(0,6);box.innerHTML=hits.length?hits.map(x=>'<div class="search-result" onclick="jumpTo(\''+x[2]+'\')"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join(''):'<div class="search-result">No matching section.</div>'}function clearSiteSearch(){document.getElementById('siteSearch').value='';renderSiteSearch()}document.getElementById('siteSearch').addEventListener('input',e=>renderSiteSearch(e.target.value));function jumpTo(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}

function changeFont(n){const current=parseFloat(localStorage.getItem('mythical-font')||'1');const next=Math.min(1.25,Math.max(.9,current+n*.05));document.documentElement.style.fontSize=(next*16)+'px';localStorage.setItem('mythical-font',next);showToast('Text size updated ✦')}function resetFont(){document.documentElement.style.fontSize='16px';localStorage.setItem('mythical-font','1');showToast('Text size reset ✦')}const savedFont=parseFloat(localStorage.getItem('mythical-font')||'1');document.documentElement.style.fontSize=(savedFont*16)+'px';function toggleMotion(){document.body.classList.toggle('reduced-motion');localStorage.setItem('mythical-motion',document.body.classList.contains('reduced-motion')?'reduced':'full');document.getElementById('motionBtn').classList.toggle('active',document.body.classList.contains('reduced-motion'));showToast(document.body.classList.contains('reduced-motion')?'Reduced motion enabled':'Full motion enabled')}if(localStorage.getItem('mythical-motion')==='reduced'){document.body.classList.add('reduced-motion');document.getElementById('motionBtn').classList.add('active')}
const brief='MYTHICAL STUDIOS — Studio snapshot\n\nProjects: SparkAgent, Mythical Studios Store, Mythical Studios\nTeam: Chethan (Founder), Vijay (Co-Owner), Venkat (Manager), Kedar (Manager)\nFocus: AI, gaming, web experiences and creative technology\n\nExplore: '+location.href;async function copyBrief(){try{await navigator.clipboard.writeText(brief);showToast('Studio snapshot copied ✦')}catch(e){showToast('Copy is unavailable in this browser')}}function downloadBrief(){const blob=new Blob([brief],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mythical-studios-snapshot.txt';a.click();URL.revokeObjectURL(a.href);showToast('Snapshot saved ✦')}
